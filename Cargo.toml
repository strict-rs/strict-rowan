# Original Taplo Release Profile
# [profile.release]
# codegen-units = 1
# lto           = "thin"
# opt-level     = 3
# strip         = true

# Original Taplo Bench
[profile.bench]
lto       = true
opt-level = 3

# ─── Release profile: small, fast, abort-on-panic ──────────────────────────
[profile.release]
lto              = "thin"
codegen-units    = 1
panic            = "abort"
strip            = "symbols"
opt-level        = 3
overflow-checks  = true
debug            = false
incremental      = false

# ─── Dev profile: fast incremental ─────────────────────────────────────────
[profile.dev]
debug            = "line-tables-only"
opt-level        = 0
overflow-checks  = true
incremental      = true

[profile.dev.package."*"]
# Optimise third-party deps in dev builds (their sources rarely change).
opt-level = 3

# ─── Test profile: overflow checks on, fast codegen ────────────────────────
[profile.test]
opt-level        = 0
overflow-checks  = true
debug            = true

# ─── cargo-machete integration ─────────────────────────────────────────────
[workspace.metadata.cargo-machete]
# Deps intentionally unused in the workspace root can be listed here.
ignored = []

[patch."https://github.com/strict-rs/strict-rowan"]
rowan = { path = "." }
xtask = { path = "xtask" }

[patch."https://github.com/strict-rs/strict-rowan.git"]
rowan = { path = "." }
xtask = { path = "xtask" }
