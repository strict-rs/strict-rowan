[package]
name = "rowan"
version.workspace = true
authors = ["Aleksey Kladov <aleksey.kladov@gmail.com>", "Takumi Shimada <hello@takumi.earth"]
repository = "https://github.com/strict-rs/strict-rowan"
license.workspace = true
description = "Library for generic lossless syntax trees"
edition.workspace = true
rust-version.workspace = true
exclude = [".github/", "bors.toml", "rustfmt.toml"]

[dependencies]
rustc-hash.workspace = true
hashbrown = { workspace = true, features = ["inline-more"], default-features = false }
text-size.workspace = true
countme.workspace = true

serde = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
m_lexer.workspace = true
serde_json.workspace = true
strict-test-support.workspace = true

[features]
serde = ["dep:serde", "text-size/serde"]

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.package]
authors      = ["Aleksey Kladov <aleksey.kladov@gmail.com>", "Takumi Shimada <hello@takumi.earth"]
edition      = "2024"
version = "0.17.0"
publish = false
license      = "MIT OR Apache-2.0"
license-file = "LICENSE-MIT or LICENSE-APACHE"
rust-version = "1.97"
homepage     = "https://github.com/strict-rs/strict-rowan"
repository   = "https://github.com/strict-rs/strict-rowan"

[workspace.dependencies]
rustc-hash = "2.1.3"
hashbrown = { version = "0.17.1", default-features = false }
text-size = "1.1.1"
countme = "3.0.1"
m_lexer = "0.0.4"
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }


tracing            = { version = "0.1.44", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict" }
tracing-subscriber = { version = "0.3.23", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict" }

bpaf = { git = "https://github.com/strict-rs/strict-bpaf.git", branch = "sync", version = "0.10", default-features = false }
template-core = { version = "0.1.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main" }
template-xtask = { version = "0.1.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main" }
trybuild = { git = "https://github.com/strict-rs/strict-trybuild.git", branch = "strict", version = "1" }
strict-test-support = { version = "0.1.0", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main" }
snapbox = { version = "1.2", features = ["diff"], default-features = false }
anstyle = "1"
cargo_metadata = "0.23"
globset = "0.4"
ignore = "0.4"
parking_lot = "0.12"
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = { git = "https://github.com/strict-rs/strict-proptest.git", branch = "strict", version = "2", features = ["std", "strict-test"], default-features = false }
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"

