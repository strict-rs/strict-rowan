[package]
name = "rowan"
version.workspace = true
authors = ["Aleksey Kladov <aleksey.kladov@gmail.com>", "Takumi Shimada <hello@takumi.earth"]
repository = "https://github.com/strict-rs/strict-rowan"
license.workspace = true
description = "Library for generic lossless syntax trees"
keywords = ["cst", "lossless", "parser", "syntax-tree"]
categories = ["data-structures", "parsing"]
edition.workspace = true
rust-version.workspace = true
exclude = [".github/", "bors.toml", "rustfmt.toml"]

[dependencies]
rustc-hash.workspace = true
hashbrown = { workspace = true, features = ["inline-more"], default-features = false }
text-size.workspace = true
countme.workspace = true
ecow = { workspace = true, features = ["std"] }
thiserror.workspace = true
triomphe = { workspace = true, features = ["std"] }

serde = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
m_lexer.workspace = true
proptest.workspace = true
serde_json = { workspace = true, features = ["std"] }
strict-test-support = { workspace = true, default-features = false }

[features]
serde = ["dep:serde", "text-size/serde"]

[workspace]
members = [".", "stask"]
resolver = "3"

[workspace.package]
authors      = ["Aleksey Kladov <aleksey.kladov@gmail.com>", "Takumi Shimada <hello@takumi.earth"]
edition      = "2024"
version = "0.17.0"
publish = false
license      = "MIT OR Apache-2.0"
license-file = "LICENSE-MIT or LICENSE-APACHE"
rust-version = "1.97"
homepage     = "https://github.com/strict-rs/strict-rowan"
repository   = "https://github.com/strict-rs/strict-rowan"

[workspace.dependencies]
rustc-hash = "2.1.3"
hashbrown = { version = "0.17.1", default-features = false }
text-size = "1.1.1"
countme = "3.0.1"
ecow = { version = "0.3.0", default-features = false }
m_lexer = "0.0.4"
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
triomphe = { version = "0.1.16", default-features = false }

tracing = { version = "0.1.44", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict"}
tracing-subscriber = { version = "0.3.23", git = "https://github.com/strict-rs/strict-tracing.git", branch = "strict"}

bpaf = {  version = "0.10", default-features = false, git = "https://github.com/strict-rs/strict-bpaf.git", branch = "sync"}
template-core = { version = "0.3.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
template-stask = { version = "0.3.0", git = "https://github.com/earthlings-dev/template-rs.git", branch = "main"}
trybuild = {  version = "1", git = "https://github.com/strict-rs/strict-trybuild.git", branch = "strict"}
strict-test-support = { version = "0.1.0", default-features = false, git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main"}
snapbox = { version = "1.2", features = ["diff"], default-features = false }
anstyle = "1"
cargo_metadata = "0.23"
globset = "0.4"
ignore = "0.4"
parking_lot = "0.12"
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = {  version = "2", features = ["std", "strict-test"], default-features = false, git = "https://github.com/strict-rs/strict-proptest.git", branch = "strict"}
syn = { version = "3", features = ["full", "visit"] }
thiserror = {  version = "2", git = "https://github.com/strict-rs/strict-thiserror.git", branch = "upgrade" }
toml = "1.1"
toml_edit = "0.25"

[patch.crates-io]
bpaf = {  version = "0.10", git = "https://github.com/strict-rs/strict-bpaf.git", branch = "sync"}
thiserror = {  version = "2.1.0", git = "https://github.com/strict-rs/strict-thiserror.git", branch = "upgrade" }

