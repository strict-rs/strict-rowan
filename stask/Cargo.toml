[package]
name         = "stask"
version      .workspace = true
edition      .workspace = true
license-file .workspace = true
authors      = ["Takumi Shimada <hello@takumi.earth>", "Aleksey Kladov <aleksey.kladov@gmail.com>"]
repository   .workspace = true
publish      .workspace = true
readme       .workspace = true
description  = "Repository-specific `x` extension runner for the installed `template` workflow."
default-run  = "stask"

[lib]
name = "stask"
path = "src/lib.rs"

[[bin]]
name = "stask"
path = "src/main.rs"

# disabled for now
# [lints]
# workspace = true

[dependencies]
template-core.workspace  = true
template-stask.workspace = true

[dev-dependencies]
strict-test-support = { workspace = true, default-features = false }
